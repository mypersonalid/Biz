
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Secure Access</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #00ff66;
      font-family: Consolas, monospace;
      overflow: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .hidden {
      display: none !important;
    }

    /* LOADING SCREEN */
    #loader {
      flex-direction: column;
      gap: 22px;
      background: radial-gradient(
        circle,
        #071509 0%,
        #000 70%
      );
    }

    .spinner {
      width: 55px;
      height: 55px;
      border: 3px solid #12351c;
      border-top-color: #00ff66;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 20px #00ff6644;
    }

    .loading-text {
      font-size: 13px;
      letter-spacing: 3px;
      text-align: center;
      animation: blink 1s infinite;
    }

    .progress {
      width: 240px;
      max-width: 70vw;
      height: 3px;
      background: #17351f;
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: #00ff66;
      box-shadow: 0 0 12px #00ff66;
      animation: loading 2.5s linear forwards;
    }

    /* PASSWORD SCREEN */
    #login {
      padding: 20px;
      background: radial-gradient(
        circle,
        #071209 0%,
        #000 75%
      );
    }

    .terminal {
      width: 100%;
      max-width: 460px;
      padding: 28px 23px;
      border: 1px solid #00a83f;
      background: #020602;
      box-shadow: 0 0 30px #00ff6618;
    }

    .terminal-header {
      font-size: 11px;
      letter-spacing: 2px;
      padding-bottom: 15px;
      margin-bottom: 25px;
      border-bottom: 1px solid #174b27;
      color: #7aff9e;
    }

    .terminal-header span {
      color: #00ff66;
    }

    .prompt {
      font-size: 12px;
      color: #65bd7d;
      margin-bottom: 25px;
      overflow-wrap: anywhere;
    }

    h1 {
      font-size: clamp(24px, 7vw, 34px);
      letter-spacing: 3px;
      margin-bottom: 10px;
      text-shadow: 0 0 15px #00ff6655;
    }

    .subtitle {
      font-size: 10px;
      letter-spacing: 2px;
      color: #549968;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input {
      width: 100%;
      min-width: 0;
      background: #000;
      border: 1px solid #26743c;
      color: #00ff66;
      padding: 14px 12px;
      font-size: 17px;
      font-family: inherit;
      outline: none;
      letter-spacing: 4px;
    }

    input:focus {
      border-color: #00ff66;
      box-shadow: 0 0 10px #00ff6622;
    }

    button {
      background: #00ff66;
      color: #001a08;
      border: none;
      padding: 0 17px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background: #a4ffbe;
    }

    #error {
      min-height: 20px;
      margin-top: 13px;
      font-size: 12px;
      color: #ff4545;
    }

    .footer {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid #174b27;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #549968;
      font-size: 9px;
    }

    /* SUCCESS TYPING SCREEN */
    #success {
      align-items: flex-start;
      justify-content: flex-start;
      padding: clamp(25px, 8vw, 80px);
    }

    .success-content {
      width: 100%;
      max-width: 900px;
    }

    .success-prompt {
      color: #299c4e;
      font-size: 12px;
      margin-bottom: 28px;
    }

    #success-message {
      font-size: clamp(22px, 5vw, 45px);
      line-height: 1.5;
      overflow-wrap: anywhere;
      text-shadow:
        0 0 10px #00ff6688,
        0 0 25px #00ff6633;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 1em;
      background: #00ff66;
      margin-left: 5px;
      vertical-align: middle;
      animation: blink 0.7s steps(2) infinite;
    }

    /* FINAL BLACK SCREEN */
    #black-screen {
      background: #000;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes loading {
      to { width: 100%; }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (max-width: 400px) {
      .terminal {
        padding: 23px 16px;
      }

      .input-row {
        flex-direction: column;
      }

      button {
        padding: 14px;
      }

      .footer {
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- STEP 1: LOADING SCREEN -->
  <div id="loader" class="screen">
    <div class="spinner"></div>

    <p class="loading-text">
      INITIALIZING SECURE SYSTEM...
    </p>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>
  </div>

  <!-- STEP 2: PASSWORD SCREEN -->
  <div id="login" class="screen hidden">
    <div class="terminal">

      <div class="terminal-header">
        <span>●</span> SECURE TERMINAL
        <span style="float:right">V1.0</span>
      </div>

      <p class="prompt">
        root@system:~$ authentication_required
      </p>

      <h1>ENTER PASSWORD</h1>

      <p class="subtitle">
        AUTHORIZED ACCESS ONLY
      </p>

      <form id="password-form">
        <label for="password">PASSWORD_</label>

        <div class="input-row">
          <input
            type="password"
            id="password"
            placeholder="******"
            inputmode="numeric"
            autocomplete="off"
            required
          >

          <button type="submit">ENTER ↵</button>
        </div>

        <p id="error" aria-live="polite"></p>
      </form>

      <div class="footer">
        <span>SYS.STATUS: ONLINE</span>
        <span>ENCRYPTION: ACTIVE</span>
      </div>

    </div>
  </div>

  <!-- STEP 3: HACKING-STYLE SUCCESS MESSAGE -->
  <div id="success" class="screen hidden">
    <div class="success-content">

      <p class="success-prompt">
        root@system:~$ ./verify_access
      </p>

      <span id="success-message"></span>
      <span class="cursor"></span>

    </div>
  </div>

  <!-- STEP 4: FULL BLACK SCREEN -->
  <div id="black-screen" class="screen hidden"></div>

  <script>
    // PASSWORD SETTINGS
    const CORRECT_PASSWORD = "282010";

    const loader = document.getElementById("loader");
    const login = document.getElementById("login");
    const success = document.getElementById("success");
    const blackScreen = document.getElementById("black-screen");

    const form = document.getElementById("password-form");
    const passwordInput = document.getElementById("password");
    const error = document.getElementById("error");
    const message = document.getElementById("success-message");

    // STEP 1: SHOW LOADING SCREEN
    window.addEventListener("load", function () {
      setTimeout(function () {
        loader.classList.add("hidden");
        login.classList.remove("hidden");
        passwordInput.focus();
      }, 2500);
    });

    // STEP 2: CHECK PASSWORD
    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (passwordInput.value === CORRECT_PASSWORD) {
        error.textContent = "";

        login.classList.add("hidden");
        success.classList.remove("hidden");

        // STEP 3: TYPE SUCCESS MESSAGE
        typeMessage(
          "password successfully completed......",
          function () {
            // STEP 4: SHOW BLACK SCREEN
            setTimeout(function () {
              success.classList.add("hidden");
              blackScreen.classList.remove("hidden");
            }, 1200);
          }
        );

      } else {
        error.textContent =
          "ACCESS DENIED — Incorrect password.";

        passwordInput.value = "";
        passwordInput.focus();
      }
    });

    // LETTER-BY-LETTER TYPING EFFECT
    function typeMessage(text, callback) {
      let index = 0;

      message.textContent = "";

      const timer = setInterval(function () {
        message.textContent += text.charAt(index);
        index++;

        if (index >= text.length) {
          clearInterval(timer);

          if (callback) {
            callback();
          }
        }
      }, 65);
    }
  </script>

</body>
  </html>
